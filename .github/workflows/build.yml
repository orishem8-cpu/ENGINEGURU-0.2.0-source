name: Build ENGINEGURU VST3
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target ENGINEGURU_VST3
      - name: Upload VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: ENGINEGURU-0.2.0-VST3-Windows
          path: build/ENGINEGURU_artefacts/Release/VST3
          if-no-files-found: error
          retention-days: 14
